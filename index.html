<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Технические работы — AG TG Exporter</title>
    <style>
        :root {
            --bg-primary: #0e1621;
            --bg-secondary: #17212b;
            --bg-hover: #202b36;
            --bg-active: #2b5278;
            --text-primary: #f5f5f5;
            --text-secondary: #7f91a4;
            --accent: #5288c1;
            --accent-light: #64b5f6;
            --border-color: #242f3d;
            --warning: #ff9800;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            height: 100vh; 
            height: 100dvh; 
            width: 100vw; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .auth-card { 
            margin: auto; 
            background: var(--bg-secondary); 
            padding: 34px 28px; 
            border-radius: 16px; 
            text-align: center; 
            max-width: 380px; 
            width: 90%; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            border: 1px solid var(--border-color);
        }

        .icon-wrap {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            background: rgba(82, 136, 193, 0.1);
            border: 1px solid rgba(82, 136, 193, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-wrap svg {
            width: 28px;
            height: 28px;
            fill: var(--accent-light);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 152, 0, 0.12);
            border: 1px solid rgba(255, 152, 0, 0.3);
            color: var(--warning);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--warning);
            border-radius: 50%;
            display: inline-block;
        }

        h2 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        p.desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 500; 
            transition: background 0.15s; 
            text-decoration: none; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        
        .btn:hover { 
            background: #4374a5; 
        }

        .spinner { 
            width: 14px; 
            height: 14px; 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            border-top: 2px solid #fff; 
            border-radius: 50%; 
            animation: spin 0.7s linear infinite; 
            display: none; 
        }

        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>

        <div class="status-badge">
            <span class="status-dot"></span>
            Сервис временно недоступен
        </div>

        <h2>Технические работы</h2>
        
        <p class="desc">
            В данный момент на сервере проводятся плановые технические работы.<br>
            Доступ к сайту будет восстановлен сразу после их завершения.
        </p>

        <button class="btn" id="reload-btn" onclick="checkAvailability()">
            <div class="spinner" id="btn-spinner"></div>
            <span id="btn-text">Обновить страницу</span>
        </button>
    </div>

    <script>
        function checkAvailability() {
            const btn = document.getElementById('reload-btn');
            const spinner = document.getElementById('btn-spinner');
            const text = document.getElementById('btn-text');

            spinner.style.display = 'inline-block';
            text.innerText = 'Проверка...';
            btn.style.pointerEvents = 'none';

            window.location.reload();
        }
    </script>
</body>
</html>
